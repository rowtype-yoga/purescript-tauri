[package]
name = "tauri-native-host"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Embedded PureScript JavaScript host with native graphics and terminal primitives"

[dependencies]
rquickjs = "0.9.0"
# The common build stays display-independent; macOS terminal sessions add Metal
# below. SVG/textlayout are unused; text is shaped by Rustybuzz.
skia-safe = "=0.153.3"
fontdb = "0.23.0"
rustybuzz = "0.20.1"
svgtypes = "0.15.3"
unicode-segmentation = "1.12"
unicode-script = "0.5"
crossterm = "0.28.1"
ctrlc = { version = "3.4", features = ["termination"] }
base64 = "0.22.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Ganesh/Metal is selected only by terminal graphics. Keep the common dependency
# CPU-only so headless exports remain available on platforms without Metal.
skia-safe = { version = "=0.153.3", features = ["ganesh", "metal"] }
objc2 = { version = "0.6.3", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice", "MTLCommandQueue"] }

