[package]
name = "tauri-plugin-launch-file"
version = "0.0.1"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-launch-file"
license = "MIT"
description = "Startup arguments and individual launch-file filesystem authorization for Tauri"
repository = "https://github.com/rowtype-yoga/purescript-tauri"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dependencies]
tauri = { version = "2.12", default-features = false }
tauri-plugin-fs = "2.6"

[dev-dependencies]
tempfile = "3"
