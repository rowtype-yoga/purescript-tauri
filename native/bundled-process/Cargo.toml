[package]
name = "tauri-plugin-bundled-process"
version = "0.0.1"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-bundled-process"
license = "MIT"
description = "Allowlisted sibling executable invocation for Tauri"
repository = "https://github.com/rowtype-yoga/purescript-tauri"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", default-features = false }
